<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Professor Bhagwan Chowdhry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── Theme tokens ─────────────────────────────────────────────── */
  :root {
    --font: 'Inter', sans-serif;
    --radius: 12px;
    --radius-sm: 8px;
    --header-h: 52px;
  }

  [data-theme="dark"] {
    --bg:           #1e1e1e;
    --bg2:          #2a2a2a;
    --bg3:          #333333;
    --border:       #3a3a3a;
    --border-chip:  #3f3f3f;
    --text:         #ececec;
    --text-dim:     #8e8e8e;
    --text-mid:     #b0b0b0;
    --text-chip:    #c0c0c0;
    --amber:        #e8834a;
    --amber-dim:    #c06030;
    --amber-glow:   #e8834a22;
    --blue:         #5b9cf6;
    --green:        #3ddc84;
    --red:          #ff5c6a;
    --input-bg:     #2c2c2c;
    --input-border: #4a4a4a;
    --btn-bg:       #2a2a2a;
    --shadow:       0 8px 32px rgba(0,0,0,0.4);
    --toggle-bg:    #3a3a3a;
    --toggle-knob:  #ececec;
    --header-bg:    #1e1e1e;
  }

  [data-theme="light"] {
    --bg:           #ffffff;
    --bg2:          #ffffff;
    --bg3:          #f4f4f5;
    --border:       #e4e4e7;
    --border-chip:  #e4e4e7;
    --text:         #09090b;
    --text-dim:     #71717a;
    --text-mid:     #52525b;
    --text-chip:    #3f3f46;
    --amber:        #d97706;
    --amber-dim:    #b45309;
    --amber-glow:   #f59e0b15;
    --blue:         #2563eb;
    --green:        #16a34a;
    --red:          #ef4444;
    --input-bg:     #ffffff;
    --input-border: #e4e4e7;
    --btn-bg:       #ffffff;
    --shadow:       0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --toggle-bg:    #e4e4e7;
    --toggle-knob:  #ffffff;
    --header-bg:    #ffffff;
  }

  /* ── Base ─────────────────────────────────────────────────────── */
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.6;
    overflow: hidden;
    transition: background 0.25s, color 0.25s;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }

  /* ── Header ───────────────────────────────────────────────────── */
  #header {
    height: var(--header-h);
    display: flex;
    align-items: center;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    background: var(--header-bg);
    flex-shrink: 0;
    z-index: 10;
    transition: background 0.25s, border-color 0.25s;
  }

  .logo {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--text);
  }

  .logo span {
    color: var(--amber);
  }

  /* Online status pill */
  #server-status {
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 5px;
    margin-left: 14px;
  }

  /* Dark/light toggle */
  #theme-toggle-wrap {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .theme-label {
    font-size: 11px;
    color: var(--text-dim);
    user-select: none;
  }

  #theme-toggle {
    position: relative;
    width: 42px;
    height: 24px;
    border-radius: 999px;
    background: var(--toggle-bg);
    border: none;
    cursor: pointer;
    transition: background 0.25s;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }

  #theme-toggle::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--toggle-knob);
    transition: transform 0.25s, background 0.25s;
  }

  [data-theme="light"] #theme-toggle::after {
    transform: translateX(18px);
  }

  /* ── Main area ────────────────────────────────────────────────── */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* ── Thread ───────────────────────────────────────────────────── */
  #thread {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  /* ── Welcome / Hero ───────────────────────────────────────────── */
  #thread-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    padding: 24px 16px 0;
    text-align: center;
    gap: 0;
  }

  .hero-avatar {
    width: 128px;
    height: 128px;
    border-radius: 50%;
    border: 2px solid var(--border);
    object-fit: cover;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }



  .hero-avatar-quote {
    font-size: 13px;
    color: var(--text-dim);
    font-style: italic;
    margin-bottom: 6px;
    letter-spacing: 0.01em;
  }

  .hero-title {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
    margin-bottom: 8px;
  }

  @media (max-width: 480px) {
    .hero-title { font-size: 20px; }
  }

  /* Bio link */
  .hero-bio-link {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    text-decoration: none;
    letter-spacing: 0.02em;
    margin-bottom: 32px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .hero-bio-link:hover { color: var(--amber); }



  /* ── Chat bubbles ─────────────────────────────────────────────── */
  .turn { display: flex; flex-direction: column; gap: 6px; animation: fadeUp 0.2s ease; max-width: 760px; width: 100%; margin: 0 auto; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;} }

  .bubble-user {
    align-self: flex-end;
    max-width: 72%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) 3px var(--radius);
    padding: 10px 16px;
    font-size: 14px;
    color: var(--amber);
    word-break: break-word;
  }

  .bubble-assistant { align-self: flex-start; max-width: 92%; width: 100%; }
  .bubble-assistant-inner {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 3px var(--radius) var(--radius) var(--radius);
    padding: 10px 14px;
    transition: background 0.25s;
  }

  .bubble-text { font-size: 14px; line-height: 1.5; color: var(--text); white-space: pre-wrap; word-break: break-word; }
  .bubble-text .cursor { display: inline-block; width: 2px; height: 1em; background: var(--amber); animation: blink 0.8s infinite; vertical-align: text-bottom; margin-left: 2px; }
  @keyframes blink { 0%,100%{opacity:1;}50%{opacity:0;} }



  /* ── Bottom input bar ─────────────────────────────────────────── */
  #input-area {
    flex-shrink: 0;
    padding: 12px 16px 20px;
    background: var(--bg);
    transition: background 0.25s;
  }

  #input-wrap {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }



  /* Main input row */
  #send-row {
    display: flex;
    gap: 8px;
    align-items: center;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: var(--radius);
    padding: 6px 8px 6px 16px;
    box-shadow: var(--shadow);
    transition: border-color 0.2s, background 0.25s;
  }

  #send-row:focus-within {
    border-color: var(--amber-dim);
  }

  #query-input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    outline: none;
    -webkit-appearance: none;
    line-height: 1.5;
    padding: 4px 0;
  }

  @media (min-width: 480px) { #query-input { font-size: 14px; } }
  #query-input::placeholder { color: var(--text-dim); }

  .icon-btn {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .icon-btn:hover { background: var(--bg3); color: var(--text); }

  .btn-send-circle {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--amber);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, opacity 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-send-circle:hover { background: var(--amber-dim); }
  .btn-send-circle:disabled { opacity: 0.4; cursor: not-allowed; }



  /* ── Scrollbar ────────────────────────────────────────────────── */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ── Misc ─────────────────────────────────────────────────────── */
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--amber); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg);} }
  .hidden { display: none !important; }

  .bubble-text .katex-display { overflow-x: auto; padding: 4px 0; }
  .latex-error { color: var(--red); font-size: 0.85em; }

  /* Markdown inside bubbles */
  .bubble-text p { margin-bottom: 0.3em; }
  .bubble-text p:last-child { margin-bottom: 0; }
  .bubble-text ul, .bubble-text ol { padding-left: 20px; margin-bottom: 0.3em; }
  .bubble-text code { font-size: 12px; background: var(--bg3); padding: 1px 5px; border-radius: 4px; }
  .bubble-text pre { background: var(--bg3); padding: 10px 12px; border-radius: var(--radius-sm); overflow-x: auto; margin-bottom: 0.3em; }
  .bubble-text pre code { background: none; padding: 0; }
  .bubble-text h1, .bubble-text h2, .bubble-text h3 { margin: 0.25em 0 0.05em; font-weight: 600; }
</style>
</head>
<body>

<div id="app">

  <!-- ── Header ──────────────────────────────────────────────────── -->
  <header id="header">
    <div class="logo"><span>BHAGWAN CHOWDHRY</span></div>
    <div id="server-status">
      <span id="server-status-text">connecting…</span>
    </div>


    <div id="theme-toggle-wrap">
      <span class="theme-label" id="theme-label">Dark</span>
      <button id="theme-toggle" aria-label="Toggle dark/light mode" onclick="toggleTheme()"></button>
    </div>
  </header>

  <!-- ── Main ────────────────────────────────────────────────────── -->
  <div id="main">

    <!-- Thread -->
    <div id="thread">
      <!-- Hero / Welcome state -->
      <div id="thread-empty">
        <img src="Bhagwan.jpeg" class="hero-avatar" alt="Professor Bhagwan Chowdhry">
        <div class="hero-title">Professor Bhagwan Chowdhry</div>
      
        <div class="hero-avatar-quote">Hello, I am not Bhagwan<br>I am his Avatar!</div>
        <a class="hero-bio-link" href="https://bhag.one/" target="_blank" rel="noopener">Prof. Bhagwan Chowdhry biography ↗</a>


      </div>
    </div>

    <!-- Input area -->
    <div id="input-area">
      <div id="input-wrap">



        <!-- Main send row -->
        <div id="send-row">

          <input id="query-input" type="text"
                 placeholder="Ask anything"
                 onkeydown="if(event.key==='Enter'&&!event.shiftKey)sendMessage()"/>

          <!-- Mic icon -->
          <button class="icon-btn" aria-label="Voice input">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <rect x="9" y="2" width="6" height="12" rx="3"/>
              <path d="M5 10a7 7 0 0014 0"/>
              <line x1="12" y1="19" x2="12" y2="22"/>
            </svg>
          </button>

          <!-- Send button -->
          <button class="btn-send-circle" id="btn-send" onclick="sendMessage()">
            <span id="btn-spinner" class="spinner hidden"></span>
            <svg id="btn-arrow" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <line x1="12" y1="19" x2="12" y2="5"/>
              <polyline points="5 12 12 5 19 12"/>
            </svg>
          </button>
        </div>


      </div>
    </div>

  </div><!-- /#main -->
</div><!-- /#app -->



<script>
/* ── Config ─────────────────────────────────────────────────────── */
const API = 'https://profile-rag.onrender.com';



/* ── Session ────────────────────────────────────────────────────── */
let SESSION_ID = crypto.randomUUID();

/* ── Theme ──────────────────────────────────────────────────────── */
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('theme-label').textContent = isDark ? 'Light' : 'Dark';
  try { localStorage.setItem('theme', isDark ? 'light' : 'dark'); } catch {}
}

(function initTheme() {
  try {
    const saved = localStorage.getItem('theme');
    if (saved) {
      document.documentElement.setAttribute('data-theme', saved);
      document.getElementById('theme-label').textContent = saved === 'dark' ? 'Dark' : 'Light';
    }
  } catch {}
})();






/* ── Stats / Status ─────────────────────────────────────────────── */
async function refreshStats() {
  try {
    const r = await fetch(`${API}/stats`);
    if (!r.ok) { setStatus(false); return; }
    setStatus(true);
  } catch { setStatus(false); }
}

function setStatus(ok) {
  const el = document.getElementById('server-status-text');
  if (!el) return;
  el.textContent = ok ? '● online' : '○ offline';
  el.style.color = ok ? 'var(--green)' : 'var(--red)';
}


/* ── Busy state ─────────────────────────────────────────────────── */
function setBusy(busy) {
  document.getElementById('btn-send').disabled      = busy;
  document.getElementById('query-input').disabled   = busy;
  document.getElementById('btn-spinner').classList.toggle('hidden', !busy);
  document.getElementById('btn-arrow').classList.toggle('hidden', busy);
}

/* ── Send message ───────────────────────────────────────────────── */
async function sendMessage() {
  const question = document.getElementById('query-input').value.trim();
  if (!question) return;
  document.getElementById('query-input').value = '';
  document.getElementById('query-input').blur();

  // Remove hero on first message
  const emptyEl = document.getElementById('thread-empty');
  if (emptyEl) emptyEl.remove();

  setBusy(true);


  const thread = document.getElementById('thread');

  // User bubble
  const userTurn = document.createElement('div');
  userTurn.className = 'turn';
  userTurn.innerHTML = `<div class="bubble-user">${escapeHtml(question)}</div>`;
  thread.appendChild(userTurn);

  // Assistant bubble
  const asstTurn = document.createElement('div');
  asstTurn.className = 'turn';
  asstTurn.innerHTML = `
    <div class="bubble-assistant">
      <div class="bubble-assistant-inner">
        <div class="bubble-text" id="current-bubble"><span class="cursor"></span></div>
      </div>
    </div>`;
  thread.appendChild(asstTurn);
  scrollThread();

  const params = new URLSearchParams({
    question,
    session_id:    SESSION_ID,
  });

  const textEl = document.getElementById('current-bubble');
  let fullText = '';

  try {
    const es = new EventSource(`${API}/query/stream?${params}`);

    es.addEventListener('token', e => {
      fullText += JSON.parse(e.data);
      textEl.innerHTML = renderMd(fullText);
      applyKatex(textEl);
      const cur = document.createElement('span');
      cur.className = 'cursor';
      textEl.appendChild(cur);
      scrollThread();
    });

    es.addEventListener('done', e => {
      const meta = JSON.parse(e.data);
      textEl.innerHTML = renderMd(fullText);
      applyKatex(textEl);
      textEl.removeAttribute('id');
      setBusy(false);
      es.close();
    });

    es.addEventListener('error', e => {
      const msg = e.data ? JSON.parse(e.data) : 'Stream error';

      textEl.innerHTML = fullText ? renderMd(fullText) : '<em style="color:var(--red)">Error</em>';
      applyKatex(textEl);
      textEl.removeAttribute('id');
      setBusy(false);
      es.close();
    });

    es.onerror = () => {
      if (es.readyState === EventSource.CLOSED) return;
      console.error('Connection lost');
      setBusy(false);
      es.close();
    };
  } catch(e) {
    console.error('Query failed: ', e);
    setBusy(false);
  }
}

function scrollThread() {
  const t = document.getElementById('thread');
  t.scrollTop = t.scrollHeight;
}




function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escapeAttr(s) { return String(s||'').replace(/"/g,'&quot;'); }

/* ── Markdown + LaTeX ───────────────────────────────────────────── */
function renderMd(text) {
  const stash = [];
  function hide(raw, display) {
    const id = '\x02' + stash.length + '\x03';
    stash.push({ id, raw, display });
    return id;
  }
  let s = text.replace(/\$\$([\s\S]+?)\$\$/g,   (_, m) => hide('$$' + m + '$$', true));
  s = s.replace(/\\\[([\s\S]+?)\\\]/g,           (_, m) => hide('\\[' + m + '\\]', true));
  s = s.replace(/\\\(([\s\S]+?)\\\)/g,           (_, m) => hide('\\(' + m + '\\)', false));
  s = s.replace(/\$([^\s$\n][^$\n]*?[^\s$\n]|\S)\$/g, (_, m) => hide('$' + m + '$', false));
  let html = marked.parse(s, { breaks: true, gfm: true });
  for (const { id, raw, display } of stash) {
    const esc = raw.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    html = html.replace(id, `<span class="latex-pending" data-display="${display}" data-raw="${esc}"></span>`);
  }
  return html;
}

function applyKatex(el) {
  el.querySelectorAll('span.latex-pending').forEach(span => {
    const display = span.dataset.display === 'true';
    const raw = span.dataset.raw
      .replace(/&amp;/g,'&').replace(/&lt;/g,'<')
      .replace(/&gt;/g,'>').replace(/&quot;/g,'"');
    const inner = raw
      .replace(/^\$\$([\s\S]*)\$\$$/, '$1')
      .replace(/^\\\[([\s\S]*)\\\]$/, '$1')
      .replace(/^\\\(([\s\S]*)\\\)$/, '$1')
      .replace(/^\$([\s\S]*)\$$/, '$1');
    try {
      span.outerHTML = katex.renderToString(inner, { displayMode: display, throwOnError: false, trust: false });
    } catch(e) {
      span.textContent = raw;
      span.className = 'latex-error';
    }
  });
}

/* ── Init ───────────────────────────────────────────────────────── */
refreshStats();
setInterval(refreshStats, 8000);
</script>
</body>
</html>
